name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security vulnerabilities must not be reported here.** Use the repository's Security tab → "Report a vulnerability" instead.
  - type: dropdown
    id: deployment
    attributes:
      label: Where are you running it?
      options:
        - Hosted service
        - Self-hosted
        - Local development
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version, commit SHA, or the version shown in the app.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, .NET version, database, Docker, etc.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any personal data, tokens or connection strings before pasting.
      render: shell
